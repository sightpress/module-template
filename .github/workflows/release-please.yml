# Keeps a release pull request open from the conventional commits on main. Merging it tags the release and updates
# CHANGELOG.md and the version in src/MyModule.php. Then Packagist is told about it.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  packagist:
    name: update Packagist
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      # Tells Packagist about every push to main and any tag just created, with the PACKAGIST_USERNAME and
      # PACKAGIST_API_TOKEN secrets (a Packagist "safe" token can only trigger updates). Without them it does nothing:
      # Packagist's GitHub hook can do the same.
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "No PACKAGIST_API_TOKEN secret: Packagist is not told about this push."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}"
